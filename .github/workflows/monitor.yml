name: Five Music stock monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_bark:
        description: "发送 Bark 测试通知"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check stock and send Bark
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_BARK: ${{ inputs.test_bark }}
        run: python monitor.py

      - name: Save state when it changes
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock monitor state"
            git push
          fi
